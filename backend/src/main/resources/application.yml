spring:
  application:
    name: chimmoccanh
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chimmoccanh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:chimmoccanh-jwt-secret-key-minimum-32-characters-long-2026}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
  team:
    team-a-color: "#C60B1E"
    team-a-name: "Tây Ban Nha"
    team-b-color: "#002395"
    team-b-name: "Pháp"
  r2:
    endpoint: ${R2_ENDPOINT:https://982674c869cf0001c1b93e4249e4c2fc.r2.cloudflarestorage.com}
    bucket: ${R2_BUCKET:chimmoccanh}
    public-url: ${R2_PUBLIC_URL:https://pub-2675187e64954989a4660b6ce9bbe2cb.r2.dev}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
